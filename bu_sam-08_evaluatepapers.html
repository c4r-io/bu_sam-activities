<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Protein X — Sample Size Rigor Activity</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Poppins', sans-serif;
    background: #F3F3F3;
    color: #333132;
    min-height: 100vh;
    padding-bottom: 80px;
  }

  /* ── TYPOGRAPHY ── */
  .t-title    { font-size: 1.2rem;  font-weight: 700; color: #202020; }
  .t-heading  { font-size: 1.1rem;  font-weight: 700; color: #202020; }
  .t-sub      { font-size: 1.0rem;  font-weight: 600; color: #202020; }
  .t-body     { font-size: 1.0rem;  font-weight: 500; color: #333132; line-height: 1.6; }
  .t-caption  { font-size: 0.85rem; font-weight: 500; color: #333132; line-height: 1.5; }
  .t-small    { font-size: 0.8rem;  font-weight: 500; color: #333132; line-height: 1.5; }

  /* ── LAYOUT ── */
  .page { max-width: 760px; margin: 0 auto; padding: 24px 20px 100px; }

  /* ── PROGRESS BAR ── */
  .progress-wrap { margin-bottom: 24px; }
  .progress-meta { display: flex; justify-content: flex-end; margin-bottom: 4px; }
  .progress-track { height: 8px; border-radius: 4px; background: #E0E0E0; overflow: hidden; }
  .progress-fill  { height: 100%; border-radius: 4px; background: #6F00FF; transition: width 0.3s ease; }

  /* ── INSTRUCTION CARD ── */
  .instruction-card {
    background: #F0F4FF;
    border-left: 4px solid #0082FF;
    border-radius: 0 6px 6px 0;
    padding: 16px;
    margin-bottom: 20px;
  }
  .instruction-card .card-title { font-size: 1.1rem; font-weight: 700; color: #202020; margin-bottom: 8px; }

  /* ── PAPER CARD ── */
  .paper-card {
    background: #fff;
    border: 1px solid #E0E0E0;
    border-radius: 8px;
    overflow: hidden;
    margin-bottom: 20px;
  }
  .paper-card-header {
    background: #F3F3F3;
    padding: 10px 16px;
    border-bottom: 1px solid #E0E0E0;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .paper-tag {
    font-size: 0.75rem; font-weight: 600;
    background: #E0E0E0; color: #333132;

  }
  .paper-card-body { padding: 16px; }
  .conclusion-block {
    background: #FFFBF0;
    border-left: 4px solid #FF8F00;
    border-radius: 0 8px 8px 0;
    padding: 12px 16px;
    margin-bottom: 20px;
  }
  .conclusion-label {
    font-size: 0.8rem; font-weight: 700; color: #FF8F00;
    text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px;
  }

  /* ── WHITE PANEL ── */
  .panel {
    background: #fff;
    border: 1px solid #E0E0E0;
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 20px;
  }

  /* ── CHECKLIST ── */
  .checklist-row {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 8px 10px; border-radius: 6px;
    border: 1px solid transparent;
    transition: all 0.2s;
    margin-bottom: 6px;
  }
  .checklist-row label { display: flex; align-items: flex-start; gap: 10px; cursor: pointer; flex: 1; }
  .checklist-row input[type=checkbox] { margin-top: 3px; accent-color: #6F00FF; width: 16px; height: 16px; flex-shrink: 0; }
  .checklist-row .row-badge {
    flex-shrink: 0; font-size: 0.7rem; font-weight: 700;
    padding: 2px 7px; border-radius: 4px; white-space: nowrap; margin-top: 2px;
  }

  /* ── RADIO OPTIONS ── */
  .radio-option {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 10px 14px; border-radius: 8px;
    border: 2px solid #E0E0E0; background: #fff;
    cursor: pointer; transition: all 0.15s ease;
    margin-bottom: 8px;
  }
  .radio-option input { margin-top: 3px; accent-color: #6F00FF; flex-shrink: 0; }
  .radio-option .opt-label { font-size: 1rem; font-weight: 600; color: #333132; }
  .radio-option .opt-desc  { font-size: 0.8rem; font-weight: 500; color: #757575; }
  .radio-option.selected   { border-color: #6F00FF; background: rgba(111,0,255,0.08); }
  .radio-option.correct    { border-color: #2E7D32; background: #F0FFF0; }
  .radio-option.incorrect  { border-color: #D32F2F; background: #FFF0F0; }

  /* Yes/No options */
  .yn-wrap { display: flex; gap: 10px; }
  .yn-option {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 24px; border-radius: 8px;
    border: 2px solid #E0E0E0; background: #fff;
    cursor: pointer; font-size: 1rem; font-weight: 600;
    color: #333132; transition: all 0.15s ease;
  }
  .yn-option input { accent-color: #6F00FF; flex-shrink: 0; }
  .yn-option.selected  { border-color: #6F00FF; background: rgba(111,0,255,0.08); }

  /* ── FEEDBACK BOX ── */
  .feedback-box {
    margin-top: 10px;
    background: rgba(111,0,255,0.08);
    border: 1px solid #6F00FF;
    border-radius: 6px; padding: 10px 14px;
  }

  /* ── CRITERIA LIST (intro) ── */
  .criteria-list { display: flex; flex-direction: column; }
  .criteria-row {
    display: flex; gap: 12px; align-items: flex-start;
    padding: 10px 0;
    border-bottom: 1px solid #E0E0E0;
  }
  .criteria-row:last-child { border-bottom: none; }

  /* ── BUTTONS ── */
  .btn {
    padding: 10px 20px; font-size: 1rem; font-weight: 600;
    border-radius: 8px; border: 2px solid; cursor: pointer;
    transition: all 0.2s ease; font-family: inherit;
  }
  .btn-primary { background: #202020; color: #fff; border-color: #202020; }
  .btn-primary:hover:not(:disabled) { background: #6F00FF; border-color: #6F00FF; }
  .btn-primary:disabled { background: #999; border-color: #999; cursor: not-allowed; }
  .btn-secondary { background: #F3F3F3; color: #333132; border-color: #F3F3F3; }
  .btn-secondary:hover { background: #333132; color: #fff; }

  /* ── NAV BAR ── */
  .nav-bar {
    position: fixed; bottom: 0; left: 0; right: 0;

    background: #fff;

  .nav-tip-wrap { position: relative; margin-left: auto; }
  .nav-tip {
    display: none; position: absolute; bottom: 110%; right: 0;
    background: #202020; color: #fff; font-size: 0.8rem;

  }
  .nav-tip-wrap:hover .nav-tip { display: block; }

  /* ── SUMMARY ACCORDION ── */
  .accordion-item {

    margin-bottom: 8px; transition: border-color 0.2s;
  }
  .accordion-item.open { border-color: #6F00FF; }
  .accordion-btn {
    width: 100%; display: flex; align-items: center;
    justify-content: space-between; gap: 12px;

  }
  .accordion-item.open .accordion-btn { background: rgba(111,0,255,0.08); border-bottom: 1px solid #E0E0E0; }
  .accordion-chevron {
    font-size: 0.8rem; font-weight: 700; color: #757575;
    transition: transform 0.2s ease; display: inline-block;
  }
  .accordion-item.open .accordion-chevron { transform: rotate(180deg); color: #6F00FF; }
  .accordion-content { padding: 14px 16px; display: flex; flex-direction: column; gap: 16px; }

  /* ── TALLY BARS ── */
  .tally-row { display: flex; align-items: center; gap: 10px; margin-bottom: 5px; }
  .tally-label { font-size: 0.8rem; font-weight: 500; color: #333132; min-width: 150px; }
  .tally-label.correct { color: #2E7D32; font-weight: 700; }
  .tally-track { flex: 1; height: 10px; border-radius: 5px; background: #E0E0E0; overflow: hidden; }
  .tally-fill  { height: 100%; border-radius: 5px; background: #6F00FF; transition: width 0.4s ease; }
  .tally-fill.correct { background: #2E7D32; }
  .tally-pct  { font-size: 0.8rem; font-weight: 500; color: #757575; min-width: 36px; text-align: right; }

  /* ── BADGES ── */
  .badge {
    font-size: 0.8rem; font-weight: 600;
    padding: 3px 10px; border-radius: 4px; display: inline-block;
  }
  .badge-green  { background: #F0FFF0; border: 1px solid #2E7D32; color: #2E7D32; }
  .badge-red    { background: #FFF0F0; border: 1px solid #D32F2F; color: #D32F2F; }
  .badge-purple { background: rgba(111,0,255,0.08); border: 1px solid #6F00FF; color: #6F00FF; }
  .badge-gray   { background: #F3F3F3; border: 1px solid #E0E0E0; color: #757575; }

  /* ── SUMMARY: EXCERPT BLOCK ── */
  .summary-excerpt {
    background: #F3F3F3;
    border-left: 3px solid #C4C4C4;
    border-radius: 0 6px 6px 0;
    padding: 12px 14px;
    margin-top: 4px;
  }

  /* ── SUMMARY: REPORTING ELEMENTS GRID ── */
  .reporting-grid {
    display: grid;

    margin-top: 6px;

  .reporting-col-header.absent  { color: #757575; }
  .reporting-list {
    list-style: none; padding: 0; margin: 0;
    display: flex; flex-direction: column; gap: 6px;
  }
  .reporting-li {
    font-size: 0.9rem; line-height: 1.4;
    padding-left: 20px; position: relative;
    color: #333132;
  }
  .reporting-li.present::before {
    content: '✓'; color: #2E7D32; font-weight: 700;
    position: absolute; left: 0; top: 0;
  }
  .reporting-li.absent::before {
    content: '−'; color: #999; font-weight: 700;

  .reporting-li-empty {

  /* ── SUMMARY: "YOUR PICK" BADGE IN BAR CHART ── */
  .your-pick-badge {
    font-size: 0.7rem; font-weight: 600;
    background: rgba(111,0,255,0.08);
    border: 1px solid #6F00FF;
    color: #6F00FF;
    padding: 2px 7px; border-radius: 4px;
    white-space: nowrap;
  }

  /* ── SUMMARY: COMMENTS TABS (folder style) ── */
  .comments-tabs-row {
    display: flex;
    border-bottom: 1px solid #9E9E9E;
    margin-top: 4px;
  }
  .comments-tab {
    background: #E0E0E0;
    color: #202020;
    border: 1px solid #9E9E9E;
    padding: 8px 18px;
    font-size: 0.9rem; font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.15s;
    margin-bottom: -1px;
    border-radius: 0;
  }
  .comments-tab:first-child { border-top-left-radius: 6px; }
  .comments-tab:last-child  { border-top-right-radius: 6px; }

    border-color: #9E9E9E;

  .comments-panel {
    border: 1px solid #E0E0E0;
    border-top: none;

    background: #fff;
    display: flex; flex-direction: column; gap: 10px;
  }
  .comment-item {
    background: #F3F3F3;

  .comment-item.is-user {

  /* ── CONGRATS ── */
  .congrats-wrap { text-align: center; padding: 40px 20px; }
  .congrats-icon {
    width: 72px; height: 72px; border-radius: 50%;
    background: rgba(111,0,255,0.08); border: 2px solid #6F00FF;
    display: flex; align-items: center; justify-content: center;
    font-size: 2rem; margin: 0 auto 24px;
  }

  /* ── SECTION LABEL ── */
  .section-label {

  }

  /* ── HIDDEN ── */
  .hidden { display: none !important; }

  textarea {
    width: 100%; font-size: 1rem; font-weight: 500;

<div id="app"></div>

<!-- NAV BAR -->
<div class="nav-bar">
  <button class="btn btn-secondary" id="btn-prev" onclick="navigate(-1)">PREVIOUS</button>
  <div class="nav-tip-wrap">
    <span class="nav-tip" id="nav-tip-text">Complete the step to continue</span>
    <button class="btn btn-primary" id="btn-next" onclick="navigate(1)">NEXT</button>

<script>
// ============================================================================
// DATA
// ============================================================================

const CHECKLIST_CRITERIA = [
  { id: 'c1', label: 'Power calculation (e.g., effect size, alpha, statistical power)' },
  { id: 'c2', label: 'Justification of reported N (e.g., prior literature or pilot data)' },
  { id: 'c3', label: 'Sample size determined before data collection' },
  { id: 'c4', label: 'Inclusion/exclusion criteria and/or attrition' },
];

const Q1_OPTIONS = [
  { value: 'insufficient',      label: 'Insufficient',      desc: 'Several reporting elements are missing or insufficient' },
  { value: 'needs_improvement', label: 'Needs Improvement', desc: 'Most elements present but some are missing' },
  { value: 'thorough',          label: 'Thorough',          desc: 'All key elements reported transparently' },
];

const Q3_OPTIONS = [
  { value: 'yes', label: 'Yes' },
  { value: 'no',  label: 'No' },
];

const PLACEHOLDER_RESPONSES = {
  A: {
    q1: ['thorough','thorough','needs_improvement','thorough','thorough'],
    q3: ['yes','yes','yes','no','yes'],
    q2: [
      'The study is transparent about being underpowered which is commendable, but I would be cautious about using it as a model given the large gap between required and actual N.',
      'Good reporting but the null result should be interpreted carefully given the underpowering — it may be a false negative.',
      'The acknowledgment of limitations is a strength. The conclusions are appropriately hedged.',
      'Power analysis is present and honest. I would want to see this replicated before drawing conclusions about Protein X.',
    ],
  },
  B: {
    q1: ['insufficient','insufficient','needs_improvement','insufficient','insufficient'],
    q3: ['no','no','no','no','yes'],
    q2: [
      'No justification for N = 12 is provided. The conclusions are far too strong given the lack of reporting.',
      'The exclusion of one animal without explanation is a red flag. This paper would not be a good model.',
      'Concerned that the recommendation for clinical translation is based on an unreported and unjustified sample size.',
      'Missing power analysis and effect size justification entirely. The conclusions overreach what this study can support.',
    ],
  },
  C: {
    q1: ['needs_improvement','needs_improvement','insufficient','needs_improvement','needs_improvement'],
    q3: ['no','no','no','no','no'],
    q2: [
      'N = 8 with 4 participants lost is not sufficient to support the claim of a validated biomarker. The conclusions are a major concern.',
      'Citing a prior study for enrollment is a start but without effect size or power analysis this cannot be used as a sample size model.',
      'The attrition rate is very high relative to the sample size. Combined with the overstated conclusions this is not a suitable model.',
      'Longitudinal studies require careful power analysis, especially with small N. This paper does not provide sufficient justification.',
    ],
  },
  D: {
    q1: ['thorough','thorough','thorough','thorough','needs_improvement'],
    q3: ['yes','yes','yes','yes','yes'],
    q2: [
      'This is the strongest model — pilot data, pre-registration, and planned attrition. Very few concerns.',
      'The cross-species design adds complexity but the reporting handles it well. Conclusions are appropriately cautious.',
      'Pre-specified exclusion criteria and a pre-registration are best practices. This is the clearest model for our study.',
      'No major concerns. The note about needing functional validation shows appropriate epistemic humility.',
    ],
  },
};

const PAPERS = [
  {
    id: 'A', tag: 'Preprint · Rodent study',
    excerpt: 'Power analysis was conducted a priori using G*Power (v3.1). Based on a previous study of related proteins in aged mice (Raven et al., 2019), we estimated an effect size and determined that n = 52 per group would be required to achieve 80% power at α = 0.05. Due to animal availability constraints, the study was conducted with n = 25 per group; this sample is acknowledged to be underpowered for the estimated effect size. All animals completed the study.',
    conclusion: 'The authors state that they observed no significant difference in Protein X expression between young and aged mice, but they recommend replication with adequately powered cohorts before findings may be considered conclusive.',
    correctChecklist: { c1: true, c2: true, c3: true, c4: true },
    q1Correct: 'thorough', q3Correct: 'yes',
    q1Feedback: 'All four reporting elements are present and limitations are disclosed honestly, a mark of thorough reporting.',
  },
  {
    id: 'B', tag: 'Rodent study',
    excerpt: 'Twelve rats per group were used in this study (n = 12 control, n = 12 treatment). Animals were housed under standard laboratory conditions with a 12-hour light/dark cycle and ad libitum access to food and water. Tissue was collected at 18 months of age and processed for western blot analysis of Protein X expression. Blots were quantified using ImageJ and normalized to β-actin loading controls. Group differences were assessed using an unpaired t-test. One animal in the treatment group was removed from analysis.',
    conclusion: 'The authors conclude that Protein X is a reliable biomarker for longevity in this animal model and recommend it as a viable target for therapeutic intervention in clinical research.',
    correctChecklist: { c1: false, c2: false, c3: false, c4: true },
    q1Correct: 'insufficient', q3Correct: 'no',
    q1Feedback: 'Several key reporting elements are missing. There is no power analysis or effect size rationale, and the exclusion is unexplained.',
  },
  {
    id: 'C', tag: 'Human longitudinal study',
    excerpt: 'Eight participants were enrolled based on a previous longitudinal study of aging biomarkers in similar populations (Chickadee et al., 2017). Participants were aged 65–80 at enrollment and reported no major health issues. Blood samples were collected at annual clinic visits and processed within 4 hours of collection. Serum Protein X levels were measured annually over 10 years and analyzed using linear mixed-effects models to account for repeated measures. Three participants withdrew during follow-up and one participant was excluded from analysis; no criteria for withdrawal or exclusion were pre-specified.',
    conclusion: 'The authors conclude that declining Protein X levels reliably predict mortality risk and propose Protein X as a validated human longevity biomarker.',
    correctChecklist: { c1: false, c2: true, c3: true, c4: true },
    q1Correct: 'needs_improvement', q3Correct: 'no',
    q1Feedback: 'Prior literature is cited and attrition is reported, but without a power analysis or pre-specified exclusion criteria, the reporting needs improvement.',
  },
  {
    id: 'D', tag: 'Cross-species sequencing study (mouse & primate)',
    excerpt: 'Power analysis was conducted prior to data collection using an estimated effect size derived from two independent pilot experiments. With α = 0.05 and 80% power, we determined n = 20 per species group was required; n = 22 were enrolled per group to account for anticipated attrition. Final analysis included n = 20 per group after excluding 2 samples that failed sequencing quality thresholds defined in our pre-registration. Protein X expression patterns were quantified by RNA sequencing and normalized using DESeq2.',
    conclusion: 'The authors conclude that Protein X expression patterns are conserved across both species and represent a candidate biomarker pathway, while noting that functional validation in larger cohorts is needed.',
    correctChecklist: { c1: true, c2: true, c3: true, c4: true },
    q1Correct: 'thorough', q3Correct: 'yes',
    q1Feedback: 'Every key reporting element is present.',
  },
];

// ============================================================================
// STATE
// ============================================================================

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

const shuffledPapers = shuffle(PAPERS);

let screen = 1;
const TOTAL_SCREENS = 7;

// checklists[paperId][criterionId] = bool
const checklists = {};
// paperState[paperId] = { q1, q3, q2, q1Submitted }
const paperState = {};

PAPERS.forEach(p => {
  checklists[p.id] = {};
  CHECKLIST_CRITERIA.forEach(c => { checklists[p.id][c.id] = false; });
  paperState[p.id] = { q1: '', q3: '', q2: '', q1Submitted: false };
});

// summary accordion state
let openSummaryId = shuffledPapers[0].id;

function getPaperLabel(id) {
  const idx = shuffledPapers.findIndex(p => p.id === id);
  return idx >= 0 ? `Paper ${idx + 1}` : '';
}

// ============================================================================
// HELPERS
// ============================================================================

function getOptionLabel(options, value) {
  const opt = options.find(o => o.value === value);
  return opt ? opt.label : '—';
}

function countResponses(arr, value) {
  return arr.filter(v => v === value).length;
}

function esc(str) {
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

// ============================================================================
// RENDER HELPERS
// ============================================================================

function renderProgressBar(current, total) {
  const pct = Math.round((current / total) * 100);
  return `
    <div class="progress-wrap">
      <div class="progress-meta"><span class="t-small">Screen ${current} of ${total}</span></div>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    </div>`;
}

function renderInstructionCard(title, bodyHtml) {
  return `
    <div class="instruction-card">
      ${title ? `<div class="card-title">${esc(title)}</div>` : ''}
      ${bodyHtml}
    </div>`;
}

function renderPaperExcerpt(paper, label) {
  return `
    <div class="paper-card">
      <div class="paper-card-header">
        <span class="t-sub">${esc(label)}</span>
        <span class="paper-tag">${esc(paper.tag)}</span>
      </div>
      <div class="paper-card-body">
        <p class="t-body">${esc(paper.excerpt)}</p>
      </div>
    </div>`;
}

function renderConclusionBlock(conclusion) {
  return `
    <div class="conclusion-block">
      <div class="conclusion-label">Authors' conclusion</div>
      <p class="t-body">${esc(conclusion)}</p>
    </div>`;
}

// Badge content for a checklist row, given the user's check state and
// whether the criterion is actually present. Used in both the initial
// render and the post-submit DOM update so they stay in sync.
function getChecklistBadge(checked, correct) {
  if (checked === correct) {
    return { text: '✓ Correct', cls: 'badge-green' };
  }
  // Wrong: tell the user the truth directly. Red + ✗ already signal
  // "you got this wrong"; the text states what's actually the case.
  if (checked) {
    return { text: '✗ Not in the excerpt', cls: 'badge-red' };
  }
  return { text: '✗ Present in the excerpt', cls: 'badge-red' };
}

function renderChecklist(paperId) {
  const paperObj = PAPERS.find(p => p.id === paperId);
  const submitted = paperState[paperId].q1Submitted;
  let rows = '';
  CHECKLIST_CRITERIA.forEach(c => {
    const checked = checklists[paperId][c.id];
    const correct = paperObj.correctChecklist[c.id];
    const isWrong = submitted && checked !== correct;

    // Only wrong rows get chrome post-submit. Correct rows stay visually
    // identical to their pre-submit state — just gain a small green badge.
    const rowStyle = isWrong ? 'border-color:#D32F2F; background:#FFF0F0;' : '';

    const badge = getChecklistBadge(checked, correct);
    const badgeHiddenCls = submitted ? '' : 'hidden';

    const disabledAttr = submitted ? 'disabled' : '';
    const checkedAttr  = checked ? 'checked' : '';
    rows += `
      <div class="checklist-row" id="row-${paperId}-${c.id}" style="${rowStyle}">
        <label>
          <input type="checkbox" ${checkedAttr} ${disabledAttr}
            onchange="toggleChecklist('${paperId}','${c.id}',this.checked)" />
          <span class="t-body">${esc(c.label)}</span>
        </label>
        <span class="badge ${badge.cls} row-badge ${badgeHiddenCls}" id="badge-${paperId}-${c.id}">${esc(badge.text)}</span>
      </div>`;
  });
  return `<div class="panel mb-20"><p class="t-sub mb-12">Reporting Elements Checklist</p>${rows}</div>`;
}

function renderQ1(paperId) {
  const ps = paperState[paperId];
  const paper = PAPERS.find(p => p.id === paperId);
  const submitted = ps.q1Submitted;

  let opts = '';
  Q1_OPTIONS.forEach(opt => {
    let cls = 'radio-option';
    if (submitted) {
      if (opt.value === paper.q1Correct) cls += ' correct';
      else if (opt.value === ps.q1)      cls += ' incorrect';
    } else {
      if (opt.value === ps.q1) cls += ' selected';
    }
    const disabledAttr = submitted ? 'disabled' : '';
    const checkedAttr  = opt.value === ps.q1 ? 'checked' : '';
    opts += `
      <label class="${cls}" id="q1opt-${paperId}-${opt.value}">
        <input type="radio" name="q1_${paperId}" value="${opt.value}" ${checkedAttr} ${disabledAttr}
          onchange="selectQ1('${paperId}','${opt.value}')" />
        <div>
          <div class="opt-label">${esc(opt.label)}</div>
          <div class="opt-desc">${esc(opt.desc)}</div>
        </div>
      </label>`;
  });

  // Feedback box and submit row are both always in the DOM. Whichever is
  // not relevant for the current state gets the .hidden class.
  const feedbackHiddenCls = submitted ? '' : 'hidden';
  const submitHiddenCls   = submitted ? 'hidden' : '';
  const submitDisabled    = (!ps.q1 || !Object.values(checklists[paperId]).some(Boolean)) ? 'disabled' : '';

  return `
    <div class="panel mb-20">
      <p class="t-sub mb-12">1. How would you rate the reporting quality of this paper?</p>
      ${opts}
      <div class="feedback-box ${feedbackHiddenCls}" id="q1-feedback-${paperId}">
        <p class="t-caption">${esc(paper.q1Feedback || '')}</p>
      </div>
      <div class="submit-row ${submitHiddenCls}" id="q1-submit-row-${paperId}">
        <button class="btn btn-primary" id="q1-submit-btn"
          onclick="submitQ1('${paperId}')" ${submitDisabled}>
          Submit
        </button>
      </div>
    </div>`;
}

function renderQ3Q2(paperId) {
  const ps = paperState[paperId];
  const paper = PAPERS.find(p => p.id === paperId);

  let ynOpts = '';
  Q3_OPTIONS.forEach(opt => {
    const cls = 'yn-option' + (opt.value === ps.q3 ? ' selected' : '');
    const checkedAttr = opt.value === ps.q3 ? 'checked' : '';
    ynOpts += `
      <label class="${cls}">
        <input type="radio" name="q3_${paperId}" value="${opt.value}" ${checkedAttr}
          onchange="selectQ3('${paperId}','${opt.value}')" />
        ${esc(opt.label)}
      </label>`;
  });

  return `
    <div class="panel mb-20 gap-20">
      <div>
        <p class="t-sub mb-12">2. Are the conclusions appropriately scoped given what has been reported about the sample size?</p>
        <div class="yn-wrap">${ynOpts}</div>
      </div>
      <div>
        <p class="t-sub mb-12">3. Based on the sample size reporting and conclusions, what comments or concerns do you have about the rigor of this study?</p>
        <textarea rows="4" placeholder="Type your response here…"
          oninput="updateQ2('${paperId}',this.value)">${esc(ps.q2)}</textarea>
      </div>
    </div>`;
}

// Build a comments-by-vote tab for one Yes/No option. The user's own
// response is pinned at the top of whichever tab matches their pick.
function buildCommentsForVote(paper, voteValue) {
  const ps = paperState[paper.id];
  const placeholders = PLACEHOLDER_RESPONSES[paper.id];

  // Pair each placeholder vote with its q2 comment by index. If q2 is
  // shorter than q3 (some classmates voted but didn't comment), those
  // voters still count in the bar chart but contribute no comment.
  const peers = placeholders.q3
    .map((vote, i) => ({
      vote,
      comment: placeholders.q2[i] || null,
      name: `Classmate ${i + 1}`,
      isUser: false,
    }))
    .filter(r => r.vote === voteValue && r.comment);

  const userMatchesTab = ps.q3 === voteValue && ps.q2 && ps.q2.trim();
  const userResponse = userMatchesTab
    ? [{ vote: ps.q3, comment: ps.q2, name: 'You', isUser: true }]
    : [];

  return [...userResponse, ...peers];
}

function renderCommentsList(comments) {
  if (comments.length === 0) {
    return '<p class="comments-empty">No comments for this option.</p>';
  }
  return comments.map(r => `
    <div class="comment-item ${r.isUser ? 'is-user' : ''}">
      <div class="comment-name">${esc(r.name)}${r.isUser ? ' (you)' : ''}</div>
      <p class="t-body" style="font-size:0.9rem">${esc(r.comment)}</p>
    </div>`).join('');
}

function renderSummaryCardContent(paper) {
  const ps = paperState[paper.id];
  const placeholders = PLACEHOLDER_RESPONSES[paper.id];

  // ── Reporting elements: split criteria into present vs absent for THIS paper.
  const presentLabels = [];
  const absentLabels  = [];
  CHECKLIST_CRITERIA.forEach(c => {
    if (paper.correctChecklist[c.id]) presentLabels.push(c.label);
    else                              absentLabels.push(c.label);
  });
  const renderColumn = (labels, kind) => {
    if (!labels.length) return '<li class="reporting-li-empty">None</li>';
    return labels.map(l => `<li class="reporting-li ${kind}">${esc(l)}</li>`).join('');
  };

  // ── Yes/No bar chart with "Your pick" badge on the user's row.
  const allVotes = [...placeholders.q3, ps.q3].filter(Boolean);
  const userVote = ps.q3;
  const barRows = Q3_OPTIONS.map(opt => {
    const count = countResponses(allVotes, opt.value);
    const pct   = allVotes.length ? Math.round((count / allVotes.length) * 100) : 0;
    const isCor  = opt.value === paper.q3Correct;
    const isUser = opt.value === userVote;
    return `
      <div class="tally-row">
        <span class="tally-label ${isCor ? 'correct' : ''}">${esc(opt.label)}${isCor ? ' ✓' : ''}</span>
        ${isUser ? '<span class="your-pick-badge">Your pick</span>' : ''}
        <div class="tally-track"><div class="tally-fill ${isCor ? 'correct' : ''}" style="width:${pct}%"></div></div>
        <span class="tally-pct">${pct}%</span>
      </div>`;
  }).join('');

  // ── Comments tabs. Default tab = user's own pick.
  const yesComments = buildCommentsForVote(paper, 'yes');
  const noComments  = buildCommentsForVote(paper, 'no');
  const defaultTab  = userVote === 'no' ? 'no' : 'yes';
  const yesActive   = defaultTab === 'yes';

  const tabsHtml = `
    <div class="comments-tabs-row">
      <button class="comments-tab ${yesActive ? 'active' : ''}"
              data-paper="${paper.id}" data-tab="yes"
              onclick="switchCommentsTab('${paper.id}','yes')">
        Yes (${yesComments.length})
      </button>
      <button class="comments-tab ${!yesActive ? 'active' : ''}"
              data-paper="${paper.id}" data-tab="no"
              onclick="switchCommentsTab('${paper.id}','no')">
        No (${noComments.length})
      </button>
    </div>
    <div class="comments-panel ${yesActive ? '' : 'hidden'}" id="comments-${paper.id}-yes">
      ${renderCommentsList(yesComments)}
    </div>
    <div class="comments-panel ${!yesActive ? '' : 'hidden'}" id="comments-${paper.id}-no">
      ${renderCommentsList(noComments)}
    </div>`;

  return `
    <div>
      <p class="section-label">Excerpt</p>
      <div class="summary-excerpt">
        <p class="t-body" style="font-size:0.9rem">${esc(paper.excerpt)}</p>
      </div>
    </div>
    <div>
      <div class="reporting-grid">
        <div>
          <p class="reporting-col-header present">Present in excerpt</p>
          <ul class="reporting-list">${renderColumn(presentLabels, 'present')}</ul>
        </div>
        <div>
          <p class="reporting-col-header absent">Absent from excerpt</p>
          <ul class="reporting-list">${renderColumn(absentLabels, 'absent')}</ul>
        </div>
      </div>
    </div>
    <div>
      <p class="section-label">Authors' conclusion</p>
      <div class="conclusion-block">
        <p class="t-body" style="font-size:0.9rem">${esc(paper.conclusion)}</p>
      </div>
    </div>
    <div style="margin-top:-8px">
      <p class="section-label">Were conclusions appropriately scoped?</p>
      ${barRows}
    </div>
    <div>
      <p class="section-label">Comments by response</p>
      ${tabsHtml}
    </div>`;
}

// ============================================================================
// SCREEN RENDERERS
// ============================================================================

function renderScreen1() {
  const criteriaRows = CHECKLIST_CRITERIA.map((c, i) => `
    <div class="criteria-row">
      <span class="criteria-num">${i + 1}.</span>
      <p class="t-body">${esc(c.label)}</p>
    </div>`).join('');

  return `
    <div class="page">
      ${renderProgressBar(1, TOTAL_SCREENS)}
      ${renderInstructionCard('Evaluating Sample Size in Published Papers', `
        <p class="t-body" style="margin-top:8px">
          Your lab is planning a study on Protein X expression as a potential biomarker for longevity.
          Below you will review excerpts from four papers measuring Protein X in aging models.
          For each paper, complete a checklist of reporting criteria and answer a few questions.
        </p>`)}
      <div class="panel">
        <p class="t-sub mb-12">Reporting Elements Checklist</p>
        <div class="criteria-list">${criteriaRows}</div>
      </div>
    </div>`;
}

function renderPaperScreen(idx) {
  const paper = shuffledPapers[idx];
  const label = `Paper ${idx + 1}`;
  const ps = paperState[paper.id];
  const postSubmitHidden = ps.q1Submitted ? '' : 'hidden';

  return `
    <div class="page">
      ${renderProgressBar(idx + 2, TOTAL_SCREENS)}
      ${renderInstructionCard('', `<p class="t-body">Read the excerpt below and mark which reporting criteria are present.</p>`)}
      ${renderPaperExcerpt(paper, label)}
      ${renderChecklist(paper.id)}
      ${renderQ1(paper.id)}
      <div class="${postSubmitHidden}" id="post-submit-${paper.id}">
        ${renderConclusionBlock(paper.conclusion)}
        ${renderQ3Q2(paper.id)}
      </div>
    </div>`;
}

function renderSummaryScreen() {
  const items = shuffledPapers.map((paper, idx) => {
    const label = `Paper ${idx + 1}`;
    const isOpen = openSummaryId === paper.id;
    const contentHtml = isOpen ? `<div class="accordion-content">${renderSummaryCardContent(paper)}</div>` : '';
    return `
      <div class="accordion-item ${isOpen ? 'open' : ''}" id="acc-${paper.id}">
        <button class="accordion-btn" onclick="toggleAccordion('${paper.id}')">
          <div style="display:flex;align-items:center;gap:10px">
            <span class="t-sub" style="color:${isOpen ? '#6F00FF' : '#202020'}">${esc(label)}</span>
            <span class="paper-tag">${esc(paper.tag)}</span>
          </div>
          <span class="accordion-chevron">▼</span>
        </button>
        ${contentHtml}
      </div>`;
  }).join('');

  return `
    <div class="page">
      ${renderProgressBar(6, TOTAL_SCREENS)}
      ${renderInstructionCard('', `<p class="t-body">See summary of responses below.</p>`)}
      ${items}
    </div>`;
}

function renderCongratsScreen() {
  return `
    <div class="page">
      <div class="congrats-wrap">
        <div class="congrats-icon">✓</div>
        <p class="t-title" style="font-size:1.4rem;margin-bottom:16px">Activity Complete</p>
        <p class="t-body" style="max-width:520px;margin:0 auto 16px">
          You practiced identifying rigorous sample size reporting across four real-world study designs.
          Recognizing what is present — and what is missing — in a methods section is the first step
          toward designing your own well-powered study.
        </p>
        <p class="t-body" style="max-width:520px;margin:0 auto">
          In the next activities, you will use these criteria to inform your own study design and
          practice reporting your sample size decisions with transparency.
        </p>
      </div>
    </div>`;
}

// ============================================================================
// NAVIGATION
// ============================================================================

function canGoNext() {
  if (screen === 1) return true;
  if (screen >= 2 && screen <= 5) {
    const idx = screen - 2;
    const paper = shuffledPapers[idx];
    const ps = paperState[paper.id];
    const atLeastOneChecked = Object.values(checklists[paper.id]).some(Boolean);
    return atLeastOneChecked && ps.q1Submitted && ps.q3 !== '' && ps.q2.trim().length > 0;
  }
  if (screen === 6) return true;
  return false;
}

function getNextDisabledMessage() {
  if (screen >= 2 && screen <= 5) {
    const paper = shuffledPapers[screen - 2];
    const ps = paperState[paper.id];
    const atLeastOneChecked = Object.values(checklists[paper.id]).some(Boolean);
    if (!atLeastOneChecked) return 'Check at least one criterion to continue';
    if (!ps.q1Submitted) return 'Submit your reporting quality answer to continue';
    if (ps.q3 === '') return 'Answer the conclusions question to continue';
    return 'Write a response to continue';
  }
  return 'Complete the step to continue';
}

function navigate(dir) {
  if (dir === 1 && !canGoNext()) return;
  screen = Math.max(1, Math.min(TOTAL_SCREENS, screen + dir));
  render();
}

function updateNavBar() {
  const btnPrev = document.getElementById('btn-prev');
  const btnNext = document.getElementById('btn-next');
  const tipEl   = document.getElementById('nav-tip-text');

  // Previous
  if (screen === 1 || screen === TOTAL_SCREENS) {
    btnPrev.style.display = 'none';
  } else {
    btnPrev.style.display = '';
    btnPrev.disabled = false;
  }

  // Next label
  const isLast = screen === TOTAL_SCREENS;
  btnNext.textContent = screen === 5 ? 'NEXT' : screen === 6 ? 'COMPLETE ACTIVITY' : 'NEXT';
  if (isLast) {
    btnNext.style.display = 'none';
  } else {
    btnNext.style.display = '';
    const ok = canGoNext();
    btnNext.disabled = !ok;
    tipEl.textContent = ok ? '' : getNextDisabledMessage();
  }
}

// ============================================================================
// EVENT HANDLERS
// ============================================================================

function toggleChecklist(paperId, criterionId, value) {
  checklists[paperId][criterionId] = value;
  // Re-enable/disable Q1 submit button if present
  const submitBtn = document.getElementById('q1-submit-btn');
  if (submitBtn) {
    const ps = paperState[paperId];
    const atLeastOne = Object.values(checklists[paperId]).some(Boolean);
    submitBtn.disabled = !ps.q1 || !atLeastOne;
  }
  updateNavBar();
}

function selectQ1(paperId, value) {
  paperState[paperId].q1 = value;
  const submitBtn = document.getElementById('q1-submit-btn');
  if (submitBtn) {
    const atLeastOne = Object.values(checklists[paperId]).some(Boolean);
    submitBtn.disabled = !value || !atLeastOne;
  }
  // Update visual selection without full re-render
  document.querySelectorAll(`input[name="q1_${paperId}"]`).forEach(inp => {
    const opt = inp.closest('.radio-option');
    opt.classList.toggle('selected', inp.value === value);
  });
  updateNavBar();
}

function submitQ1(paperId) {
  paperState[paperId].q1Submitted = true;
  applyQ1Submitted(paperId);

  // Smooth-scroll the feedback box into view. It sits directly below the
  // Q1 options, so landing the eye there primes the user for the conclusion
  // and Q2/Q3 that just appeared underneath.
  const feedback = document.getElementById(`q1-feedback-${paperId}`);
  if (feedback) {
    requestAnimationFrame(() => {
      feedback.scrollIntoView({ behavior: 'smooth', block: 'center' });
    });
  }
}

// Apply post-submit visuals via DOM manipulation — no full re-render.
// Called from submitQ1, which has just flipped paperState[id].q1Submitted.
function applyQ1Submitted(paperId) {
  const paper = PAPERS.find(p => p.id === paperId);
  const ps = paperState[paperId];

  // Checklist: lock checkboxes, reveal badges, and color only the wrong rows.
  // Badge content is (re)written from CURRENT state — it was baked into the
  // DOM at screen-render time with all-unchecked state, so revealing it
  // as-is would show stale labels.
  CHECKLIST_CRITERIA.forEach(c => {
    const checked = checklists[paperId][c.id];
    const correct = paper.correctChecklist[c.id];
    const isMatch = checked === correct;

    const row     = document.getElementById(`row-${paperId}-${c.id}`);
    const badgeEl = document.getElementById(`badge-${paperId}-${c.id}`);
    if (!row) return;

    const cb = row.querySelector('input[type=checkbox]');
    if (cb) cb.disabled = true;

    if (badgeEl) {
      const badge = getChecklistBadge(checked, correct);
      badgeEl.textContent = badge.text;
      badgeEl.classList.remove('badge-green', 'badge-red');
      badgeEl.classList.add(badge.cls);
      badgeEl.classList.remove('hidden');
    }

    if (!isMatch) {
      row.style.borderColor = '#D32F2F';
      row.style.background  = '#FFF0F0';
    }
  });

  // Q1 options: disable, swap selected → correct/incorrect classes.
  Q1_OPTIONS.forEach(opt => {
    const optEl = document.getElementById(`q1opt-${paperId}-${opt.value}`);
    if (!optEl) return;
    const input = optEl.querySelector('input');
    if (input) input.disabled = true;
    optEl.classList.remove('selected');
    if (opt.value === paper.q1Correct) optEl.classList.add('correct');
    else if (opt.value === ps.q1)      optEl.classList.add('incorrect');
  });

  // Reveal feedback, hide submit row, reveal post-submit section.
  const feedback  = document.getElementById(`q1-feedback-${paperId}`);
  const submitRow = document.getElementById(`q1-submit-row-${paperId}`);
  const postSub   = document.getElementById(`post-submit-${paperId}`);
  if (feedback)  feedback.classList.remove('hidden');
  if (submitRow) submitRow.classList.add('hidden');
  if (postSub)   postSub.classList.remove('hidden');

  updateNavBar();
}

function selectQ3(paperId, value) {
  paperState[paperId].q3 = value;
  document.querySelectorAll(`input[name="q3_${paperId}"]`).forEach(inp => {
    inp.closest('.yn-option').classList.toggle('selected', inp.value === value);
  });
  updateNavBar();
}

function updateQ2(paperId, value) {
  paperState[paperId].q2 = value;
  updateNavBar();
}

function toggleAccordion(id) {
  openSummaryId = openSummaryId === id ? null : id;
  render();
}

function switchCommentsTab(paperId, tabValue) {
  // Toggle active class on tab buttons (in-place, no re-render).
  document.querySelectorAll(`.comments-tab[data-paper="${paperId}"]`).forEach(el => {
    el.classList.toggle('active', el.dataset.tab === tabValue);
  });
  // Toggle panel visibility.
  ['yes', 'no'].forEach(v => {
    const panel = document.getElementById(`comments-${paperId}-${v}`);
    if (panel) panel.classList.toggle('hidden', v !== tabValue);
  });
}

// ============================================================================
// RENDER
// ============================================================================

function render() {
  const app = document.getElementById('app');
  if (screen === 1) app.innerHTML = renderScreen1();
  else if (screen >= 2 && screen <= 5) app.innerHTML = renderPaperScreen(screen - 2);
  else if (screen === 6) app.innerHTML = renderSummaryScreen();
  else if (screen === 7) app.innerHTML = renderCongratsScreen();
  updateNavBar();
  window.scrollTo(0, 0);
}

// Initial render
render();
</script>
