<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Statistical Power Visualization</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/recharts@2.5.0/dist/Recharts.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useMemo } = React;
        const { ComposedChart, Line, XAxis, YAxis, CartesianGrid, Area, ReferenceLine, Legend, ResponsiveContainer } = Recharts;

        // Simple Slider component
        const Slider = ({ value, onValueChange, min, max, step, className }) => {
            return (
                <input
                    type="range"
                    min={min}
                    max={max}
                    step={step}
                    value={value[0]}
                    onChange={(e) => onValueChange([parseFloat(e.target.value)])}
                    className={`w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer ${className}`}
                    style={{
                        background: `linear-gradient(to right, #3b82f6 0%, #3b82f6 ${((value[0] - min) / (max - min)) * 100}%, #e5e7eb ${((value[0] - min) / (max - min)) * 100}%, #e5e7eb 100%)`
                    }}
                />
            );
        };

        const StatisticalPowerTTest = () => {
            const [range95, setRange95] = useState(25);
            const [meanDiff, setMeanDiff] = useState(4);
            const [sampleSize, setSampleSize] = useState(20);
            const [stage, setStage] = useState(1);
            const [freeResponse1, setFreeResponse1] = useState('');
            const [mcq1Answer, setMcq1Answer] = useState('');
            const [mcq2Answer, setMcq2Answer] = useState('');
            const [freeResponse2, setFreeResponse2] = useState('');

            const normalCDF = (x) => {
                const t = 1 / (1 + 0.2316419 * Math.abs(x));
                const d = 0.3989423 * Math.exp(-x * x / 2);
                const prob = d * t * (0.3193815 + t * (-0.3565638 + t * (1.781478 + t * (-1.821256 + t * 1.330274))));
                return x > 0 ? 1 - prob : prob;
            };

            const normalPDF = (x, mean, sd) => {
                return (1 / (sd * Math.sqrt(2 * Math.PI))) * Math.exp(-0.5 * Math.pow((x - mean) / sd, 2));
            };

            const calculations = useMemo(() => {
                const sd = range95 / (2 * 1.96);
                const cohensD = meanDiff / sd;
                const seDiff = sd * Math.sqrt(2 / sampleSize);
                const df = 2 * sampleSize - 2;
                const tCritical = df > 30 ? 1.96 : 2.042;
                const criticalDiff = tCritical * seDiff;
                const zUpper = (criticalDiff - meanDiff) / seDiff;
                const zLower = (-criticalDiff - meanDiff) / seDiff;
                const powerUpper = 1 - normalCDF(zUpper);
                const powerLower = normalCDF(zLower);
                const power = powerUpper + powerLower;

                return {
                    sd,
                    cohensD,
                    seDiff,
                    criticalDiff,
                    power: Math.max(0, Math.min(1, power)),
                    tCritical,
                    powerUpper,
                    powerLower
                };
            }, [range95, meanDiff, sampleSize]);

            const generateData = useMemo(() => {
                const data = [];
                const seDiff = calculations.seDiff;
                const nullMean = 0;
                const altMean = meanDiff;
                const minX = -30;
                const maxX = 40;
                const steps = 300;
                const stepSize = (maxX - minX) / steps;
                const lowerCritical = -calculations.criticalDiff;
                const upperCritical = calculations.criticalDiff;

                for (let i = 0; i <= steps; i++) {
                    const x = minX + i * stepSize;
                    const nullDist = normalPDF(x, nullMean, seDiff);
                    const altDist = normalPDF(x, altMean, seDiff);
                    const alphaRegion = (x < lowerCritical || x > upperCritical) ? nullDist : 0;
                    const powerRegion = (x < lowerCritical || x > upperCritical) ? altDist : 0;
                    const betaRegion = (x >= lowerCritical && x <= upperCritical) ? altDist : 0;

                    data.push({
                        x: x.toFixed(3),
                        null: nullDist,
                        alternative: altDist,
                        alpha: alphaRegion,
                        power: powerRegion,
                        beta: betaRegion
                    });
                }

                return { data, nullMean, altMean, lowerCritical, upperCritical };
            }, [range95, meanDiff, sampleSize, calculations]);

            const handleStage1Continue = () => {
                if (freeResponse1.trim()) {
                    setStage(2);
                    setRange95(25);
                }
            };

            const handleStage2Continue = () => {
                if (mcq1Answer === 'About 6 Hz') {
                    setStage(3);
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            };

            return (
                <div className="w-full max-w-5xl mx-auto p-4 space-y-4">
                    <div className="text-center space-y-2">
                        <h1 className="text-3xl font-bold">Statistical Power Visualization</h1>
                        <p className="text-sm text-gray-500">
                            Example: Comparing firing rates (spikes/second) between two groups of neurons
                        </p>
                    </div>

                    <div className="bg-blue-50 p-4 rounded-lg">
                        <p className="text-center font-semibold">
                            {stage === 1 && "Explore how variability affects the null hypothesis distribution and the regions where we might reject H₀."}
                            {stage === 2 && "Now explore the impact of effect size on the power of a significance test to correctly reject H₀ when Hₐ is true."}
                            {stage === 3 && "Now, explore the effect that adjusting sample size can have on power under different conditions of variability and effect size."}
                        </p>
                    </div>

                    {stage === 1 && (
                        <div className="space-y-3 p-4 bg-blue-50 rounded-lg">
                            <label className="font-semibold text-lg">Variability</label>
                            <p className="text-sm text-gray-600">95% of firing rates fall within this range</p>
                            <div className="flex items-center justify-between">
                                <span className="text-sm">Low</span>
                                <span className="text-2xl font-bold text-blue-600">±{range95} Hz</span>
                                <span className="text-sm">High</span>
                            </div>
                            <Slider
                                value={[range95]}
                                onValueChange={(v) => setRange95(v[0])}
                                min={10}
                                max={40}
                                step={1}
                            />
                        </div>
                    )}

                    {stage === 2 && (
                        <div className="space-y-6">
                            <div className="bg-gray-100 p-4 rounded-lg text-center">
                                <label className="font-semibold text-lg">Variability (Fixed)</label>
                                <p className="text-sm text-gray-600">95% of firing rates fall within this range</p>
                                <span className="text-2xl font-bold text-gray-700">±{range95} Hz</span>
                            </div>

                            <div className="space-y-3 p-4 bg-green-50 rounded-lg">
                                <label className="font-semibold text-lg">Effect Size</label>
                                <p className="text-sm text-gray-600">Difference in average firing rates</p>
                                <div className="flex items-center justify-between">
                                    <span className="text-sm">Small</span>
                                    <span className="text-2xl font-bold text-green-600">{meanDiff} Hz</span>
                                    <span className="text-sm">Large</span>
                                </div>
                                <Slider
                                    value={[meanDiff]}
                                    onValueChange={(v) => setMeanDiff(v[0])}
                                    min={0}
                                    max={8}
                                    step={0.5}
                                />
                            </div>

                            <div className="bg-purple-50 p-4 rounded-lg">
                                <div className="text-center">
                                    <label className="font-semibold text-lg">Sample Size</label>
                                    <p className="text-sm text-gray-600">Neurons per group</p>
                                    <span className="text-2xl font-bold text-purple-600">{sampleSize}</span>
                                </div>
                            </div>
                        </div>
                    )}

                    {stage === 3 && (
                        <div className="space-y-6">
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <div className="space-y-3 p-4 bg-blue-50 rounded-lg">
                                    <label className="font-semibold text-lg">Variability</label>
                                    <p className="text-sm text-gray-600">95% of firing rates fall within this range</p>
                                    <div className="flex items-center justify-between">
                                        <span className="text-sm">Low</span>
                                        <span className="text-2xl font-bold text-blue-600">±{range95} Hz</span>
                                        <span className="text-sm">High</span>
                                    </div>
                                    <Slider
                                        value={[range95]}
                                        onValueChange={(v) => setRange95(v[0])}
                                        min={10}
                                        max={40}
                                        step={1}
                                    />
                                </div>

                                <div className="space-y-3 p-4 bg-green-50 rounded-lg">
                                    <label className="font-semibold text-lg">Effect Size</label>
                                    <p className="text-sm text-gray-600">Difference in average firing rates</p>
                                    <div className="flex items-center justify-between">
                                        <span className="text-sm">Small</span>
                                        <span className="text-2xl font-bold text-green-600">{meanDiff} Hz</span>
                                        <span className="text-sm">Large</span>
                                    </div>
                                    <Slider
                                        value={[meanDiff]}
                                        onValueChange={(v) => setMeanDiff(v[0])}
                                        min={0}
                                        max={8}
                                        step={0.5}
                                    />
                                </div>
                            </div>

                            <div className="space-y-3 p-4 bg-purple-50 rounded-lg">
                                <label className="font-semibold text-lg">Sample Size</label>
                                <p className="text-sm text-gray-600">Neurons per group</p>
                                <div className="flex items-center justify-between">
                                    <span className="text-sm">Few</span>
                                    <span className="text-2xl font-bold text-purple-600">{sampleSize}</span>
                                    <span className="text-sm">Many</span>
                                </div>
                                <Slider
                                    value={[sampleSize]}
                                    onValueChange={(v) => setSampleSize(v[0])}
                                    min={2}
                                    max={60}
                                    step={2}
                                />
                            </div>
                        </div>
                    )}

                    {stage <= 3 && (
                        <div className="bg-white p-4 rounded-lg shadow-lg">
                            <div className="mb-2">
                                <h3 className="font-semibold text-lg">Sampling Distribution of Mean Difference</h3>
                                <p className="text-sm text-gray-600">Distribution of (Group B Mean - Group A Mean) across repeated experiments</p>
                            </div>
                            <div style={{ width: '100%', height: '350px' }}>
                                <ResponsiveContainer width="100%" height="100%">
                                    <ComposedChart data={generateData.data} margin={{ top: 10, right: 40, left: 20, bottom: 30 }}>
                                        <CartesianGrid strokeDasharray="3 3" />
                                        <XAxis
                                            dataKey="x"
                                            label={{ value: 'Difference in Mean Firing Rate (Hz)', position: 'insideBottom', offset: -5 }}
                                            tickFormatter={(value) => parseFloat(value).toFixed(0)}
                                            domain={[-30, 40]}
                                            type="number"
                                        />
                                        <YAxis
                                            label={{ value: 'Probability Density', angle: -90, position: 'insideLeft' }}
                                            domain={[0, 0.4]}
                                        />

                                        <Area
                                            type="monotone"
                                            dataKey="alpha"
                                            fill="#ef4444"
                                            fillOpacity={0.3}
                                            stroke="none"
                                            name="α (Type I Error) = 0.05"
                                        />

                                        {stage >= 2 && (
                                            <Area
                                                type="monotone"
                                                dataKey="beta"
                                                fill="#f59e0b"
                                                fillOpacity={0.2}
                                                stroke="none"
                                                name="β (Type II Error)"
                                            />
                                        )}

                                        {stage >= 2 && (
                                            <Area
                                                type="monotone"
                                                dataKey="power"
                                                fill="#a855f7"
                                                fillOpacity={0.4}
                                                stroke="none"
                                                name="Power (1-β)"
                                            />
                                        )}

                                        <Line
                                            type="monotone"
                                            dataKey="null"
                                            stroke="#3b82f6"
                                            strokeWidth={3}
                                            dot={false}
                                            name="H₀: No difference"
                                        />

                                        {stage >= 2 && (
                                            <Line
                                                type="monotone"
                                                dataKey="alternative"
                                                stroke="#10b981"
                                                strokeWidth={3}
                                                dot={false}
                                                name="Hₐ: True difference"
                                            />
                                        )}

                                        <ReferenceLine
                                            x={generateData.lowerCritical}
                                            stroke="#ef4444"
                                            strokeDasharray="3 3"
                                        />
                                        <ReferenceLine
                                            x={generateData.upperCritical}
                                            stroke="#ef4444"
                                            strokeDasharray="3 3"
                                        />

                                        <ReferenceLine
                                            x={0}
                                            stroke="#3b82f6"
                                            strokeWidth={2}
                                        />

                                        {stage >= 2 && (
                                            <ReferenceLine
                                                x={meanDiff}
                                                stroke="#10b981"
                                                strokeWidth={2}
                                            />
                                        )}
                                    </ComposedChart>
                                </ResponsiveContainer>
                            </div>

                            <div className="flex flex-wrap justify-center gap-3 mt-2 text-xs">
                                <div className="flex items-center gap-2">
                                    <div className="w-4 h-4 bg-red-400 opacity-30"></div>
                                    <span>α (Type I Error) = 0.05</span>
                                </div>
                                {stage >= 2 && (
                                    <>
                                        <div className="flex items-center gap-2">
                                            <div className="w-4 h-4 bg-amber-400 opacity-20"></div>
                                            <span>β (Type II Error)</span>
                                        </div>
                                        <div className="flex items-center gap-2">
                                            <div className="w-4 h-4 bg-purple-400 opacity-40"></div>
                                            <span>Power (1-β)</span>
                                        </div>
                                    </>
                                )}
                                <div className="flex items-center gap-2">
                                    <div className="w-4 h-3 border-2 border-blue-600"></div>
                                    <span>H₀: No difference</span>
                                </div>
                                {stage >= 2 && (
                                    <div className="flex items-center gap-2">
                                        <div className="w-4 h-3 border-2 border-green-600"></div>
                                        <span>Hₐ: True difference</span>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {stage === 2 && (
                        <div className="grid grid-cols-2 gap-4">
                            <div className="p-4 bg-amber-50 rounded-lg text-center">
                                <div className="text-sm text-gray-600">β (Type II Error)</div>
                                <div className="text-2xl font-bold text-amber-600">{((1 - calculations.power) * 100).toFixed(1)}%</div>
                            </div>
                            <div className="p-4 bg-purple-50 rounded-lg text-center">
                                <div className="text-sm text-gray-600">Statistical Power</div>
                                <div className="text-2xl font-bold text-purple-600">{(calculations.power * 100).toFixed(1)}%</div>
                            </div>
                        </div>
                    )}

                    {stage === 3 && (
                        <div className="grid grid-cols-2 gap-4">
                            <div className="p-4 bg-amber-50 rounded-lg text-center">
                                <div className="text-sm text-gray-600">β (Type II Error)</div>
                                <div className="text-2xl font-bold text-amber-600">{((1 - calculations.power) * 100).toFixed(1)}%</div>
                            </div>
                            <div className="p-4 bg-purple-50 rounded-lg text-center">
                                <div className="text-sm text-gray-600">Statistical Power</div>
                                <div className="text-2xl font-bold text-purple-600">{(calculations.power * 100).toFixed(1)}%</div>
                            </div>
                        </div>
                    )}

                    {stage >= 2 && stage <= 3 && (
                        <div className="bg-blue-50 p-3 rounded-lg space-y-1">
                            <h3 className="font-semibold text-sm">Understanding the Visualization:</h3>
                            <ul className="text-xs space-y-1 list-disc list-inside">
                                <li><span className="text-blue-600 font-semibold">Blue curve (H₀):</span> Sampling distribution when there is actually no difference between groups (centered at 0)</li>
                                <li><span className="text-green-600 font-semibold">Green curve (Hₐ):</span> Sampling distribution when the true difference equals {meanDiff} Hz</li>
                                <li><span className="text-red-600 font-semibold">Red shaded areas:</span> Alpha (α = 0.05) - regions where we reject H₀. Under the null hypothesis, we incorrectly reject 5% of the time (Type I error)</li>
                                <li><span className="text-amber-600 font-semibold">Orange shaded area:</span> Beta (β) - region where we fail to reject H₀ when Hₐ is true (Type II error)</li>
                                <li><span className="text-purple-600 font-semibold">Purple shaded areas:</span> Statistical power (1-β) - probability of correctly detecting the effect when it exists</li>
                            </ul>
                        </div>
                    )}

                    {stage === 1 && (
                        <div className="bg-yellow-50 p-6 rounded-lg border-2 border-yellow-200">
                            <h3 className="font-semibold text-lg mb-3">Question:</h3>
                            <p className="mb-4">
                                The areas shaded in red represent the 5% of the distribution of mean differences where the null hypothesis might be rejected when it is actually true (Type I error). How do changes in variability affect the positioning of these areas and their associated cut-off from the remainder of the distribution?
                            </p>
                            <textarea
                                value={freeResponse1}
                                onChange={(e) => setFreeResponse1(e.target.value)}
                                className="w-full p-3 border rounded-lg min-h-32"
                                placeholder="Type your response here..."
                            />
                            <button
                                onClick={handleStage1Continue}
                                disabled={!freeResponse1.trim()}
                                className="mt-3 px-6 py-2 bg-blue-600 text-white rounded-lg disabled:bg-gray-300 disabled:cursor-not-allowed hover:bg-blue-700 transition"
                            >
                                Continue
                            </button>
                        </div>
                    )}

                    {stage === 2 && (
                        <div className="bg-green-50 p-6 rounded-lg border-2 border-green-200">
                            <h3 className="font-semibold text-lg mb-3">Question:</h3>
                            <p className="mb-4">
                                When 95% of the differences fall within a range of ±25 Hz, what is the smallest effect size that can be detected with 80% power by rejecting the null hypothesis when N = 20?
                            </p>
                            <div className="space-y-2">
                                {['About 4 Hz', 'About 5 Hz', 'About 6 Hz', 'About 7 Hz'].map((option) => (
                                    <label key={option} className="flex items-center space-x-3 p-3 bg-white rounded cursor-pointer hover:bg-green-100">
                                        <input
                                            type="radio"
                                            name="mcq1"
                                            value={option}
                                            checked={mcq1Answer === option}
                                            onChange={(e) => setMcq1Answer(e.target.value)}
                                            className="w-4 h-4"
                                        />
                                        <span>{option}</span>
                                        {mcq1Answer === option && option === 'About 6 Hz' && (
                                            <span className="ml-auto text-green-600 font-semibold">✓ Correct!</span>
                                        )}
                                        {mcq1Answer === option && option !== 'About 6 Hz' && (
                                            <span className="ml-auto text-red-600 font-semibold">Try again</span>
                                        )}
                                    </label>
                                ))}
                            </div>
                            <button
                                onClick={handleStage2Continue}
                                disabled={mcq1Answer !== 'About 6 Hz'}
                                className="mt-3 px-6 py-2 bg-blue-600 text-white rounded-lg disabled:bg-gray-300 disabled:cursor-not-allowed hover:bg-blue-700 transition"
                            >
                                Continue
                            </button>
                        </div>
                    )}

                    {stage === 3 && (
                        <div className="space-y-6">
                            <div className="bg-green-50 p-6 rounded-lg border-2 border-green-200">
                                <h3 className="font-semibold text-lg mb-3">Question:</h3>
                                <p className="mb-4">
                                    Let's say the smallest effect size that we'd like to be able to test for is about 2 Hz, and we expect 95% of our variance to be within a range of about ±15 Hz. What sample size would we need to have an 80% chance of correctly rejecting H₀ if Hₐ is true?
                                </p>
                                <div className="space-y-2">
                                    {['At least 20', 'At least 35', 'At least 50', 'At least 57'].map((option) => (
                                        <label key={option} className="flex items-center space-x-3 p-3 bg-white rounded cursor-pointer hover:bg-green-100">
                                            <input
                                                type="radio"
                                                name="mcq2"
                                                value={option}
                                                checked={mcq2Answer === option}
                                                onChange={(e) => setMcq2Answer(e.target.value)}
                                                className="w-4 h-4"
                                            />
                                            <span>{option}</span>
                                            {mcq2Answer === option && option === 'At least 57' && (
                                                <span className="ml-auto text-green-600 font-semibold">✓ Correct!</span>
                                            )}
                                            {mcq2Answer === option && option !== 'At least 57' && (
                                                <span className="ml-auto text-red-600 font-semibold">Try again</span>
                                            )}
                                        </label>
                                    ))}
                                </div>
                            </div>

                            <div className="bg-yellow-50 p-6 rounded-lg border-2 border-yellow-200">
                                <h3 className="font-semibold text-lg mb-3">Reflection Question:</h3>
                                <p className="mb-4">
                                    Play with the sliders some more. How would you describe the relationship between data variability, effect size, sample size, and power? What have you learned?
                                </p>
                                <textarea
                                    value={freeResponse2}
                                    onChange={(e) => setFreeResponse2(e.target.value)}
                                    className="w-full p-3 border rounded-lg min-h-32"
                                    placeholder="Type your response here..."
                                />
                            </div>

                            <button
                                onClick={() => setStage(4)}
                                className="w-full px-6 py-3 bg-green-600 text-white text-lg font-semibold rounded-lg hover:bg-green-700 transition"
                            >
                                Complete
                            </button>
                        </div>
                    )}

                    {stage === 4 && (
                        <div className="bg-gradient-to-br from-green-50 to-blue-50 p-12 rounded-lg text-center shadow-lg">
                            <div className="text-6xl mb-6">🎉</div>
                            <h2 className="text-3xl font-bold text-green-800 mb-4">Congratulations!</h2>
                            <p className="text-lg text-gray-700 max-w-3xl mx-auto">
                                You have explored the representation of statistical power in distributions of theoretical mean differences and learned about the impact of variability, effect size, and sample size on its value.
                            </p>
                        </div>
                    )}
                </div>
            );
        };

        ReactDOM.render(<StatisticalPowerTTest />, document.getElementById('root'));
    </script>
</body>
</html>
