// ─── Simulated dataset ────────────────────────────────────────────────────────
// X ~ Normal(0,1) clamped ±2, Y = 0.9*X + Normal(0,10) + 73
function generateData() {
  let s = 42;
  function rand() {
    s = (s * 1664525 + 1013904223) & 0xffffffff;
    return (s >>> 0) / 0xffffffff;
  }
  function randn() {
    const u = rand(), v = rand();
    return Math.sqrt(-2 * Math.log(u + 1e-10)) * Math.cos(2 * Math.PI * v);
  }
  const data = [];
  for (let i = 0; i < 100; i++) {
    const x = Math.max(-2, Math.min(2, randn()));
    const noise = randn() * 10;
    const y = 0.9 * x + noise + 73;
    data.push({ x: parseFloat(x.toFixed(3)), y: parseFloat(y.toFixed(1)) });
  }
  return data;
}

const DATA = generateData();

// ─── Regression helpers ───────────────────────────────────────────────────────
function linearRegression(data) {
  const n = data.length;
  const sumX = data.reduce((a, d) => a + d.x, 0);
  const sumY = data.reduce((a, d) => a + d.y, 0);
  const sumXY = data.reduce((a, d) => a + d.x * d.y, 0);
  const sumX2 = data.reduce((a, d) => a + d.x * d.x, 0);
  const slope = (n * sumXY - sumX * sumY) / (n * sumX2 - sumX * sumX);
  const intercept = (sumY - slope * sumX) / n;
  return { slope, intercept };
}

function computeCI(data, xVals) {
  const n = data.length;
  const { slope, intercept } = linearRegression(data);
  const meanX = data.reduce((a, d) => a + d.x, 0) / n;
  const residuals = data.map(d => d.y - (slope * d.x + intercept));
  const sse = residuals.reduce((a, r) => a + r * r, 0);
  const se = Math.sqrt(sse / (n - 2));
  const sxx = data.reduce((a, d) => a + (d.x - meanX) ** 2, 0);
  const t95 = 1.984;
  return xVals.map(x => {
    const yHat = slope * x + intercept;
    const margin = t95 * se * Math.sqrt(1 / n + (x - meanX) ** 2 / sxx);
    return { x, yHat, upper: yHat + margin, lower: yHat - margin };
  });
}

// ─── StyledButton ─────────────────────────────────────────────────────────────
// TODO: Replace with shared StyledButton component
function StyledButton({ children, onClick, disabled, variant = 'primary', style = {} }) {
  const [hovered, setHovered] = useState(false);
  const base = {
    padding: '10px 20px', fontSize: '1rem', fontWeight: 600,
    borderRadius: 8, border: 'none',
    cursor: disabled ? 'not-allowed' : 'pointer',
    transition: 'all 0.2s ease',
    boxShadow: disabled ? 'none' : '0 2px 8px rgba(0,0,0,0.15)',
    transform: hovered && !disabled ? 'scale(1.02)' : 'scale(1)',
  };
  const variants = {
    primary: {
      background: disabled ? C.mid : hovered ? C.accent : C.black,
      color: C.white,
    },
    secondary: {
      background: disabled ? C.border : hovered ? C.dark : C.lightGray,
      color: disabled ? C.mid : hovered ? C.white : C.dark,
      border: `2px solid ${disabled ? C.border : hovered ? C.dark : C.lightGray}`,
    },
  };
  return (
    <button
      onClick={disabled ? undefined : onClick}
      onMouseEnter={() => setHovered(true)}
      onMouseLeave={() => setHovered(false)}
      style={{ ...base, ...variants[variant], ...style }}
    >
      {children}
    </button>
  );
}

// ─── DistributionBar ──────────────────────────────────────────────────────────
// userResponses: string or array — user's chosen options (shown with "You said" tag)
// correctResponses: string or array — correct answers (shown bold)
function DistributionBar({ label, options, counts, total, userResponses = [], correctResponses = [] }) {
  const userSet = new Set(Array.isArray(userResponses) ? userResponses : [userResponses]);
  const correctSet = new Set(Array.isArray(correctResponses) ? correctResponses : [correctResponses]);
  return (
    <div style={{ marginBottom: 16 }}>
      <div style={{ fontSize: '0.8rem', fontWeight: 700, color: C.dark, marginBottom: 8 }}>{label}</div>
      {options.map((opt, i) => {
        const pct = total > 0 ? Math.round((counts[i] / total) * 100) : 0;
        const isUser = userSet.has(opt);
        const isCorrect = correctSet.size > 0 && correctSet.has(opt);
        return (
          <div key={opt} style={{ marginBottom: 6 }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 3 }}>
              <span style={{
                fontSize: '0.8rem',
                fontWeight: isCorrect ? 700 : 500,
                color: C.dark,
                display: 'flex', alignItems: 'center', gap: 6,
              }}>
                {opt}
                {isUser && (
                  <span style={{
                    fontSize: '0.7rem', fontWeight: 600, color: C.accent,
                    background: C.accentLight, border: `1px solid ${C.accent}`,
                    borderRadius: 4, padding: '1px 6px', lineHeight: 1.6,
                  }}>You said</span>
                )}
              </span>
              <span style={{ fontSize: '0.8rem', fontWeight: 500, color: C.mid, flexShrink: 0, marginLeft: 8 }}>{pct}%</span>
            </div>
            <div style={{ height: 8, background: C.border, borderRadius: 999, overflow: 'hidden' }}>
              <div style={{
                height: '100%', width: `${pct}%`,
                background: isUser ? C.accent : '#B0B0B0',
                borderRadius: 999,
                transition: 'width 0.5s ease',
              }} />
            </div>
          </div>
        );
      })}
    </div>
  );
}

// ─── ResponseTabs ─────────────────────────────────────────────────────────────
// Folder-style tabs that group peer responses by which option they chose.
// Default tab is the user's own selection. Each tab contains:
//   - (optional) a per-option confidence distribution
//   - a paginated list of justifications from peers who chose that option
// On the user's own tab, their justification is pinned to the top of the list
// and clearly marked.
// Props:
//   options               full option strings (must match user's stored answer)
//   tabLabels             short labels for the tab headers (defaults to options)
//   peerTextByOption      { [option]: string[] } justifications grouped by choice
//   peerConfidenceByOption (optional) { [option]: number[] } counts per confidence
//   confidenceOptions     (optional) label array, e.g. ['Not confident', ...]
//   userOption            the user's choice (tab opens here by default)
//   userConfidence        (optional) user's confidence rating
//   userJustification     user's free-text justification
// TODO: Replace with shared Tabs / Pagination components when available.
function ResponseTabs({
  options,
  tabLabels,
  peerTextByOption,
  peerConfidenceByOption,
  confidenceOptions,
  userOption,
  userConfidence,
  userJustification,
}) {
  const labels = tabLabels || options;
  const initialIdx = Math.max(0, options.indexOf(userOption));
  const [activeIdx, setActiveIdx] = useState(initialIdx);
  const [page, setPage] = useState(0);

  const handleTabClick = (idx) => {
    setActiveIdx(idx);
    setPage(0);
  };

  const activeOption = options[activeIdx];
  const activeLabel = labels[activeIdx];
  const isOwnTab = activeOption === userOption;

  const showConfidence = !!peerConfidenceByOption && !!confidenceOptions;
  const confidenceCounts = showConfidence
    ? (peerConfidenceByOption[activeOption] || new Array(confidenceOptions.length).fill(0))
    : [];
  const confidenceTotal = confidenceCounts.reduce((a, b) => a + b, 0);
  const confidenceUser = isOwnTab ? userConfidence : '';

  const peerJustifications = peerTextByOption[activeOption] || [];
  const hasOwnEntry = isOwnTab && userJustification && userJustification.trim().length > 0;
  const entries = [
    ...(hasOwnEntry ? [{ text: userJustification, isUser: true }] : []),
    ...peerJustifications.map(t => ({ text: t, isUser: false })),
  ];

  const PAGE_SIZE = 3;
  const totalPages = Math.max(1, Math.ceil(entries.length / PAGE_SIZE));
  const pageStart = page * PAGE_SIZE;
  const pageItems = entries.slice(pageStart, pageStart + PAGE_SIZE);

  return (
    <div style={{ marginTop: 20 }}>
      {/* Tab row */}
      <div style={{
        display: 'flex',
        alignItems: 'stretch',
        borderBottom: '1px solid #9E9E9E',
      }}>
        {options.map((opt, i) => {
          const isActive = activeIdx === i;
          const isFirst = i === 0;
          const isLast = i === options.length - 1;
          return (
            <div
              key={opt}
              onClick={() => handleTabClick(i)}
              style={{
                flex: 1,
                padding: '10px 12px',
                background: isActive ? C.black : '#E0E0E0',
                color: isActive ? C.white : C.black,
                border: '1px solid #9E9E9E',
                borderBottom: isActive ? 'none' : '1px solid #9E9E9E',
                borderTopLeftRadius: isFirst ? 6 : 0,
                borderTopRightRadius: isLast ? 6 : 0,
                marginLeft: isFirst ? 0 : -1,
                marginBottom: -1,
                cursor: 'pointer',
                fontSize: '0.9rem',
                fontWeight: 600,
                textAlign: 'center',
                position: 'relative',
                zIndex: isActive ? 1 : 0,
                userSelect: 'none',
                transition: 'background-color 0.15s ease',
              }}
            >
              {labels[i]}
              {opt === userOption && (
                <span style={{
                  marginLeft: 6,
                  fontSize: '0.7rem',
                  fontWeight: 500,
                  opacity: 0.85,
                }}>
                  (your answer)
                </span>
              )}
            </div>
          );
        })}
      </div>

      {/* Content panel */}
      <div style={{
        border: '1px solid #E0E0E0',
        borderTop: 'none',
        background: C.white,
        padding: 16,
        borderBottomLeftRadius: 8,
        borderBottomRightRadius: 8,
      }}>
        {/* Confidence breakdown (optional) */}
        {showConfidence && (
          <div style={{ marginBottom: 18 }}>
            <div style={{ fontSize: '0.9rem', fontWeight: 700, color: C.black, marginBottom: 10 }}>
              Confidence — peers who chose "{activeLabel}" (n = {confidenceTotal})
            </div>
            <DistributionBar
              label=""
              options={confidenceOptions}
              counts={confidenceCounts}
              total={confidenceTotal}
              userResponses={confidenceUser}
            />
          </div>
        )}

        {/* Paginated justifications */}
        <div>
          <div style={{
            display: 'flex', justifyContent: 'space-between', alignItems: 'baseline',
            marginBottom: 10, gap: 12, flexWrap: 'wrap',
          }}>
            <div style={{ fontSize: '0.9rem', fontWeight: 700, color: C.black }}>
              Justifications from peers who chose "{activeLabel}"
            </div>
            {entries.length > 0 && (
              <div style={{ fontSize: '0.75rem', fontWeight: 500, color: C.mid }}>
                Showing {pageStart + 1}–{Math.min(pageStart + PAGE_SIZE, entries.length)} of {entries.length}
              </div>
            )}
          </div>

          {entries.length === 0 ? (
            <div style={{
              padding: '10px 14px', borderRadius: 8,
              background: C.lightGray, border: `1px dashed ${C.border}`,
              fontSize: '0.9rem', color: C.mid, fontStyle: 'italic',
            }}>
              No peer justifications available for this answer.
            </div>
          ) : (
            <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
              {pageItems.map((entry, i) => (
                <div key={pageStart + i} style={{
                  padding: '10px 14px', borderRadius: 8,
                  background: entry.isUser ? C.accentLight : C.lightGray,
                  border: entry.isUser ? `1.5px solid ${C.accent}` : `1px solid ${C.border}`,
                  fontSize: '0.9rem', fontWeight: 500, color: C.dark,
                  fontStyle: entry.isUser ? 'normal' : 'italic',
                }}>
                  {entry.isUser && (
                    <div style={{
                      display: 'inline-block',
                      fontSize: '0.7rem', fontWeight: 700, color: C.accent,
                      background: C.white, border: `1px solid ${C.accent}`,
                      borderRadius: 4, padding: '1px 6px',
                      marginBottom: 6,
                      letterSpacing: '0.04em',
                    }}>
                      YOUR RESPONSE
                    </div>
                  )}
                  <div>
                    {entry.isUser ? entry.text : `"${entry.text}"`}
                  </div>
                </div>
              ))}
            </div>
          )}

          {/* Pagination controls */}
          {totalPages > 1 && (
            <div style={{
              display: 'flex', alignItems: 'center', justifyContent: 'center',
              gap: 12, marginTop: 14,
            }}>
              <button
                onClick={() => setPage(p => Math.max(0, p - 1))}
                disabled={page === 0}
                style={{
                  background: page === 0 ? C.white : C.lightGray,
                  color: page === 0 ? C.mid : C.dark,
                  border: `1px solid ${C.border}`,
                  borderRadius: 6,
                  padding: '6px 14px',
                  fontSize: '0.85rem',
                  fontWeight: 600,
                  cursor: page === 0 ? 'not-allowed' : 'pointer',
                  transition: 'background-color 0.15s ease',
                }}
              >
                ← Prev
              </button>
              <span style={{ fontSize: '0.8rem', fontWeight: 500, color: C.dark, minWidth: 80, textAlign: 'center' }}>
                Page {page + 1} of {totalPages}
              </span>
              <button
                onClick={() => setPage(p => Math.min(totalPages - 1, p + 1))}
                disabled={page === totalPages - 1}
                style={{
                  background: page === totalPages - 1 ? C.white : C.lightGray,
                  color: page === totalPages - 1 ? C.mid : C.dark,
                  border: `1px solid ${C.border}`,
                  borderRadius: 6,
                  padding: '6px 14px',
                  fontSize: '0.85rem',
                  fontWeight: 600,
                  cursor: page === totalPages - 1 ? 'not-allowed' : 'pointer',
                  transition: 'background-color 0.15s ease',
                }}
              >
                Next →
              </button>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

// ─── Scatterplot ──────────────────────────────────────────────────────────────
function Scatterplot({ showRegression = false }) {
  const W = 560, H = 340;
  const pad = { top: 20, right: 20, bottom: 50, left: 56 };
  const innerW = W - pad.left - pad.right;
  const innerH = H - pad.top - pad.bottom;
  const xMin = -2.2, xMax = 2.2;

  const rawYMin = Math.min(...DATA.map(d => d.y));
  const rawYMax = Math.max(...DATA.map(d => d.y));
  const yPad = (rawYMax - rawYMin) * 0.08;
  const yMin = Math.floor((rawYMin - yPad) / 2) * 2;
  const yMax = Math.ceil((rawYMax + yPad) / 2) * 2;

  function scaleX(v) { return pad.left + ((v - xMin) / (xMax - xMin)) * innerW; }
  function scaleY(v) { return pad.top + ((yMax - v) / (yMax - yMin)) * innerH; }

  const xTicks = [-2, -1, 0, 1, 2];
  const yTickCount = 6;
  const yTickStep = Math.ceil((yMax - yMin) / (yTickCount - 1) / 2) * 2;
  const yTicks = Array.from({ length: yTickCount }, (_, i) => yMin + i * yTickStep).filter(t => t <= yMax);

  const { slope, intercept } = linearRegression(DATA);
  const ciXVals = Array.from({ length: 60 }, (_, i) => xMin + (i / 59) * (xMax - xMin));
  const ciData = computeCI(DATA, ciXVals);
  const lineY1 = slope * xMin + intercept;
  const lineY2 = slope * xMax + intercept;

  const upperPath = ciData.map((d, i) =>
    `${i === 0 ? 'M' : 'L'}${scaleX(d.x).toFixed(1)},${scaleY(d.upper).toFixed(1)}`
  ).join(' ');
  const lowerPath = ciData.map((d, i) =>
    `${i === 0 ? 'M' : 'L'}${scaleX(d.x).toFixed(1)},${scaleY(d.lower).toFixed(1)}`
  ).join(' ');
  const lowerPathRev = [...ciData].reverse().map((d, i) =>
    `L${scaleX(d.x).toFixed(1)},${scaleY(d.lower).toFixed(1)}`
  ).join(' ');
  const ciPath = upperPath + ' ' + lowerPathRev + ' Z';

  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{ width: '100%', maxWidth: W, display: 'block', margin: '0 auto' }}>
      {yTicks.map(t => (
        <line key={t} x1={pad.left} x2={pad.left + innerW} y1={scaleY(t)} y2={scaleY(t)} stroke={C.border} strokeWidth="1" />
      ))}
      {xTicks.map(t => (
        <line key={t} x1={scaleX(t)} x2={scaleX(t)} y1={pad.top} y2={pad.top + innerH} stroke={C.border} strokeWidth="1" />
      ))}
      {showRegression && <path d={ciPath} fill="rgba(111,0,255,0.10)" stroke="none" />}
      {showRegression && (
        <line x1={scaleX(xMin)} y1={scaleY(lineY1)} x2={scaleX(xMax)} y2={scaleY(lineY2)} stroke={C.accent} strokeWidth="2.5" strokeLinecap="round" />
      )}
      {showRegression && (
        <>
          <path d={upperPath} fill="none" stroke={C.accent} strokeWidth="1" strokeDasharray="4 3" opacity="0.5" />
          <path d={lowerPath} fill="none" stroke={C.accent} strokeWidth="1" strokeDasharray="4 3" opacity="0.5" />
        </>
      )}
      {DATA.map((d, i) => (
        <circle key={i} cx={scaleX(d.x)} cy={scaleY(d.y)} r="4" fill={C.blue} fillOpacity="0.55" stroke={C.white} strokeWidth="0.8" />
      ))}
      <line x1={pad.left} y1={pad.top + innerH} x2={pad.left + innerW} y2={pad.top + innerH} stroke={C.dark} strokeWidth="1.5" />
      <line x1={pad.left} y1={pad.top} x2={pad.left} y2={pad.top + innerH} stroke={C.dark} strokeWidth="1.5" />
      {xTicks.map(t => (
        <text key={t} x={scaleX(t)} y={pad.top + innerH + 18} textAnchor="middle" fontSize="12" fill={C.dark}>{t}</text>
      ))}
      {yTicks.map(t => (
        <text key={t} x={pad.left - 8} y={scaleY(t) + 4} textAnchor="end" fontSize="12" fill={C.dark}>{t}</text>
      ))}
      <text x={pad.left + innerW / 2} y={H - 4} textAnchor="middle" fontSize="13" fontWeight="600" fill={C.dark}>
        Protein X Expression (z-score)
      </text>
      <text transform={`translate(13,${pad.top + innerH / 2}) rotate(-90)`} textAnchor="middle" fontSize="13" fontWeight="600" fill={C.dark}>
        Lifespan (years)
      </text>
      {showRegression && (
        <text x={pad.left + innerW - 4} y={pad.top + 16} textAnchor="end" fontSize="12" fontWeight="600" fill={C.accent}>
          slope = 0.90
        </text>
      )}
      {showRegression && (
        <text x={pad.left + 8} y={pad.top + 16} textAnchor="start" fontSize="11" fill={C.accent} opacity="0.8">
          — 95% confidence interval
        </text>
      )}
    </svg>
  );
}

          label="Is there support for the hypothesis?"
          options={['Yes, the data supports the hypothesis', 'No, the data does not support the hypothesis', 'The data is inconclusive']}
          counts={[
            PEER_DIST.s2conclude[0] + (s2Conclude === 'Yes, the data supports the hypothesis' ? 1 : 0),
            PEER_DIST.s2conclude[1] + (s2Conclude === 'No, the data does not support the hypothesis' ? 1 : 0),
            PEER_DIST.s2conclude[2] + (s2Conclude === 'The data is inconclusive' ? 1 : 0),
          ]}
          total={PEER_DIST.s2conclude.reduce((a, b) => a + b, 0) + 1}
          userResponses={s2Conclude}
          correctResponses="The data is inconclusive"
        />

        <ResponseTabs
          options={['Yes, the data supports the hypothesis', 'No, the data does not support the hypothesis', 'The data is inconclusive']}
          tabLabels={['Supported', 'Not supported', 'Inconclusive']}
          peerTextByOption={PEER_TEXT_S2_BY_CONCLUDE}
          userOption={s2Conclude}
          userJustification={s2Justification}
        />
      </div>
    </div>
  );
}

// ─── Screen 3 ─────────────────────────────────────────────────────────────────
function Screen3({ s3What, setS3What }) {
  return (
    <div>
      <ProgressBar current={5} />
      <InstructionCard
        subtitle="Consider what evidence would be needed to draw a confident conclusion from this data."
      />
      <CollapsibleStudyOverview />
      <div style={{ marginBottom: 16 }}>
        <Scatterplot showRegression={true} />
      </div>
      <div style={{ marginBottom: 20 }}>
        <div style={{ fontSize: '1rem', fontWeight: 700, color: C.black, marginBottom: 4 }}>
          Which of the following changes would increase your confidence in identifying a relationship?
        </div>
        <div style={{ fontSize: '0.8rem', fontWeight: 500, color: C.mid, marginBottom: 12 }}>
          Select all that apply
        </div>
        {Object.keys(s3What).map(opt => (
          <CheckboxOption
            key={opt}
            label={opt}
            checked={s3What[opt]}
            onChange={() => setS3What(prev => ({ ...prev, [opt]: !prev[opt] }))}
          />
        ))}
      </div>
    </div>
  );
}

// ─── Feedback 3 ───────────────────────────────────────────────────────────────
// Three decoupled sections to avoid color-coding conflicts:
//   1. Correct-answer indicator — green/orange signals option's helpfulness ONLY
//   2. Peer DistributionBar     — purple signals user's selection ONLY
//   3. Explanations             — neutral (gray) cards, no color coding
// "What to do next?" lives behind a reveal button so students think first.
function Feedback3({ s3What, showNextSteps, setShowNextSteps }) {

  const allOptions = Object.keys(s3What);
  const userSelected = allOptions.filter(k => s3What[k]);
  const helpfulOptions = allOptions.filter(opt => HELPFUL_OPTIONS.has(opt));
  const notHelpfulOptions = allOptions.filter(opt => !HELPFUL_OPTIONS.has(opt));
  const orderedExplanations = [...helpfulOptions, ...notHelpfulOptions];

  // Shared small styles
  const sectionHeading = {
    fontSize: '0.95rem', fontWeight: 700, color: C.black,
    marginBottom: 10,
  };
  const sectionDivider = { borderTop: `1px solid ${C.border}`, margin: '20px 0' };
  const optionRow = {
    display: 'flex', alignItems: 'baseline', gap: 10,
    fontSize: '0.95rem', fontWeight: 500, color: C.dark,
    padding: '4px 0',
  };

  return (
    <div>
      <ProgressBar current={6} />
      <CollapsibleStudyOverview />

      <div style={{
        background: C.white, border: `1px solid ${C.border}`,
        borderRadius: 10, padding: 20, marginBottom: 20,
      }}>
        <div style={{ fontSize: '1.2rem', fontWeight: 700, color: C.black, marginBottom: 16 }}>
          Response Summary
        </div>

        {/* ── Section 1: Which options are helpful ──────────────────────── */}
        <div>
          <div style={sectionHeading}>
            Which changes would help?
          </div>

          <div style={{ fontSize: '0.8rem', fontWeight: 700, color: C.dark, letterSpacing: '0.04em', textTransform: 'uppercase', marginBottom: 4, marginTop: 4 }}>
            Helpful
          </div>
          {helpfulOptions.map(opt => (
            <div key={opt} style={optionRow}>
              <span style={{ fontSize: '1rem', fontWeight: 700, color: C.successBorder, lineHeight: 1, width: 16, flexShrink: 0 }}>✓</span>
              <span>{opt}</span>
            </div>
          ))}

          <div style={{ fontSize: '0.8rem', fontWeight: 700, color: C.dark, letterSpacing: '0.04em', textTransform: 'uppercase', marginBottom: 4, marginTop: 12 }}>
            Not helpful
          </div>
          {notHelpfulOptions.map(opt => (
            <div key={opt} style={optionRow}>
              <span style={{ fontSize: '1rem', fontWeight: 700, color: C.warningBorder, lineHeight: 1, width: 16, flexShrink: 0 }}>✗</span>
              <span>{opt}</span>
            </div>
          ))}
        </div>

        <div style={sectionDivider} />

        {/* ── Section 2: Peer distribution ──────────────────────────────── */}
        <div>
          <div style={sectionHeading}>
            How others answered
          </div>
          <DistributionBar
            label=""
            options={allOptions}
            counts={allOptions.map((opt, i) => PEER_DIST.s3what[i] + (s3What[opt] ? 1 : 0))}
            total={PEER_DIST.s3what.reduce((a, b) => a + b, 0) + userSelected.length}
            userResponses={userSelected}
          />
        </div>

        <div style={sectionDivider} />

        {/* ── Section 3: Explanations (neutral, no color coding) ───────── */}
        <div>
          <div style={sectionHeading}>
            Why each option would or wouldn't help
          </div>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
            {orderedExplanations.map(opt => {
              const isHelpful = HELPFUL_OPTIONS.has(opt);
              return (
                <div key={opt} style={{
                  padding: '10px 14px', borderRadius: 8,
                  border: `1.5px solid ${isHelpful ? C.successBorder : C.warningBorder}`,
                  background: isHelpful ? C.successBg : C.warningBg,
                }}>
                  <div style={{ fontSize: '0.9rem', fontWeight: 700, color: C.black, marginBottom: 4 }}>
                    {opt}
                  </div>
                  <div style={{ fontSize: '0.85rem', fontWeight: 500, color: C.dark, lineHeight: 1.5 }}>
                    {OPTION_FEEDBACK[opt]}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      </div>

      {/* ── What to do next? (reveal) ────────────────────────────────────── */}
      {!showNextSteps ? (
        <div style={{ display: 'flex', justifyContent: 'center', marginBottom: 20 }}>
          <StyledButton variant="primary" onClick={() => setShowNextSteps(true)}>
            What to do next?
          </StyledButton>
        </div>
      ) : (
        <div style={{
          padding: '14px 16px', marginBottom: 20, borderRadius: 8,
          border: `1.5px solid ${C.blue}`,
          background: C.blueBg,
        }}>
          <div style={{ fontSize: '1.2rem', fontWeight: 700, color: C.black, marginBottom: 10 }}>
            What to do next?
          </div>
          <div style={{ fontSize: '1rem', fontWeight: 500, color: C.dark }}>
            These data are very ambiguous! There is no obvious trend. But… the slope we measured isn't zero. How confidently can we rule out the possibility that a true relationship is hiding within these data? If there was a steeper slope then those confidence intervals wouldn't be such a problem. But failing that, what we really need is to shrink those confidence intervals around our line until we know with higher certainty what the effect really is.
            <br /><br />
            What might it take to accomplish that?
          </div>
        </div>
      )}
    </div>
  );
}

// ─── Final Results ────────────────────────────────────────────────────────────
function FinalResults({ s1Predict, s1Confidence, s1Justification, s2Conclude, s2Justification, s3What }) {
  const userS3Selected = Object.keys(s3What).filter(k => s3What[k]);
  return (
    <div>
      <ProgressBar current={7} />
      <CollapsibleStudyOverview />

      <InstructionCard
        title="Activity Results"
        subtitle="You just interpreted real research data, first on your own and then with the help of a statistical analysis."
      />

      <div style={{
        background: C.white, border: `1px solid ${C.border}`,
        borderRadius: 10, padding: 20, marginBottom: 16,
      }}>
        <div style={{ fontSize: '1.2rem', fontWeight: 700, color: C.black, marginBottom: 12 }}>
          Screen 1 — Initial Interpretation
        </div>
        <DistributionBar
          label="Does Protein X expression appear correlated with lifespan?"
          options={['Yes', 'No', 'Impossible to tell']}
          counts={[
            PEER_DIST.s1predict[0] + (s1Predict === 'Yes' ? 1 : 0),
            PEER_DIST.s1predict[1] + (s1Predict === 'No' ? 1 : 0),
            PEER_DIST.s1predict[2] + (s1Predict === 'Impossible to tell' ? 1 : 0),
          ]}
          total={PEER_DIST.s1predict.reduce((a, b) => a + b, 0) + 1}
          userResponses={s1Predict}
        />
        <DistributionBar
          label="How confident are you?"
          options={['Not confident', 'Somewhat confident', 'Very confident']}
          counts={[
            PEER_DIST.s1confidence[0] + (s1Confidence === 'Not confident' ? 1 : 0),
            PEER_DIST.s1confidence[1] + (s1Confidence === 'Somewhat confident' ? 1 : 0),
            PEER_DIST.s1confidence[2] + (s1Confidence === 'Very confident' ? 1 : 0),
          ]}
          total={PEER_DIST.s1confidence.reduce((a, b) => a + b, 0) + 1}
          userResponses={s1Confidence}
        />
        <UserResponseBox label="Your justification" value={s1Justification} />
      </div>

      <div style={{
        background: C.white, border: `1px solid ${C.border}`,
        borderRadius: 10, padding: 20, marginBottom: 16,
      }}>
        <div style={{ fontSize: '1.2rem', fontWeight: 700, color: C.black, marginBottom: 12 }}>
          Screen 2 — After Statistical Analysis
        </div>
        <DistributionBar
          label="Is there support for the hypothesis?"
          options={['Yes, the data supports the hypothesis', 'No, the data does not support the hypothesis', 'The data is inconclusive']}
          counts={[
            PEER_DIST.s2conclude[0] + (s2Conclude === 'Yes, the data supports the hypothesis' ? 1 : 0),
            PEER_DIST.s2conclude[1] + (s2Conclude === 'No, the data does not support the hypothesis' ? 1 : 0),
            PEER_DIST.s2conclude[2] + (s2Conclude === 'The data is inconclusive' ? 1 : 0),
          ]}
          total={PEER_DIST.s2conclude.reduce((a, b) => a + b, 0) + 1}
          userResponses={s2Conclude}
          correctResponses="The data is inconclusive"
        />
        <UserResponseBox label="Your justification" value={s2Justification} />
      </div>

      <div style={{
        background: C.white, border: `1px solid ${C.border}`,
        borderRadius: 10, padding: 20, marginBottom: 24,
      }}>
        <div style={{ fontSize: '1.2rem', fontWeight: 700, color: C.black, marginBottom: 12 }}>
          Screen 3 — How to Find a True Effect
        </div>
        <DistributionBar
          label="What would you need to see to confidently know if there is a relationship?"
          options={Object.keys(s3What)}
          counts={Object.keys(s3What).map((opt, i) => PEER_DIST.s3what[i] + (s3What[opt] ? 1 : 0))}
          total={PEER_DIST.s3what.reduce((a, b) => a + b, 0) + userS3Selected.length}
          userResponses={userS3Selected}
          correctResponses={Array.from(HELPFUL_OPTIONS)}
        />
      </div>
    </div>
  );
}

// ─── Congrats ─────────────────────────────────────────────────────────────────
function CongratsScreen() {
  return (
    <div style={{ textAlign: 'center', padding: '48px 24px' }}>
      <div style={{ fontSize: '3rem', marginBottom: 16 }}>🎉</div>
      <div style={{ fontSize: '1.2rem', fontWeight: 700, color: C.black, marginBottom: 12 }}>
        Activity Complete
      </div>
      <div style={{ fontSize: '1rem', fontWeight: 500, color: C.dark, maxWidth: 480, margin: '0 auto' }}>
        You worked through a real research result and practiced interpreting what a statistical analysis can and cannot tell you. The tension between the slope and the confidence interval you observed is at the heart of what makes scientific conclusions hard to draw — and worth examining carefully.
      </div>
    </div>
  );
}

// ─── Main activity ─────────────────────────────────────────────────────────────
function Activity() {
  const [screen, setScreen] = useState(1);

  // Screen 1 state
  const [s1Predict, setS1Predict] = useState('');
  const [s1Justification, setS1Justification] = useState('');
  const [s1Confidence, setS1Confidence] = useState('');

  // Screen 2 state
  const [s2Conclude, setS2Conclude] = useState('');
  const [s2Justification, setS2Justification] = useState('');

  // Screen 3 state
  const [s3What, setS3What] = useState({
    'A larger sample of data points': false,
    'A steeper regression line': false,
    'Narrower confidence intervals': false,
    'Perform more statistical tests': false,
    'Repeat this experiment in a different population': false,
  });

  // Feedback 3 reveal state — gates advancement from screen 6
  const [showNextSteps, setShowNextSteps] = useState(false);

  function canProceed() {
    if (screen === 1) return s1Predict !== '' && s1Justification.trim().length > 0 && s1Confidence !== '';
    if (screen === 3) return s2Conclude !== '' && s2Justification.trim().length > 0;
    if (screen === 5) return Object.values(s3What).some(Boolean);
    if (screen === 6) return showNextSteps;
    return true;
  }

  function nextTooltip() {
    if (screen === 1) {
      if (!s1Predict) return 'Select an answer to continue';
      if (!s1Justification.trim()) return 'Enter your justification to continue';
      if (!s1Confidence) return 'Select your confidence level to continue';
    }
    if (screen === 3) {
      if (!s2Conclude) return 'Select a conclusion to continue';
      if (!s2Justification.trim()) return 'Enter your justification to continue';
    }
    if (screen === 5) return 'Select at least one option to continue';
    if (screen === 6) return 'Reveal "What to do next?" to continue';
    return '';
  }

  function goNext() {
    if (!canProceed()) return;
    if (screen === TOTAL_SCREENS) {
      setScreen(7);
    } else {
      setScreen(s => s + 1);
    }
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function goPrev() {
    if (screen > 1) {
      setScreen(s => s - 1);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  }

  const isCongratsScreen = screen === 7;

  return (
    <div style={{ background: C.lightGray, minHeight: '100vh', fontFamily: 'system-ui, sans-serif' }}>
      <div style={{ maxWidth: 680, margin: '0 auto', padding: '24px 16px 120px' }}>

        {screen === 1 && (
          <Screen1
            s1Predict={s1Predict} setS1Predict={setS1Predict}
            s1Justification={s1Justification} setS1Justification={setS1Justification}
            s1Confidence={s1Confidence} setS1Confidence={setS1Confidence}
          />
        )}
        {screen === 2 && (
          <Feedback1
            s1Predict={s1Predict}
            s1Confidence={s1Confidence}
            s1Justification={s1Justification}
          />
        )}
        {screen === 3 && (
          <Screen2
            s2Conclude={s2Conclude} setS2Conclude={setS2Conclude}
            s2Justification={s2Justification} setS2Justification={setS2Justification}
          />
        )}
        {screen === 4 && (
          <Feedback2
            s2Conclude={s2Conclude}
            s2Justification={s2Justification}
          />
        )}
        {screen === 5 && (
          <Screen3
            s3What={s3What} setS3What={setS3What}
          />
        )}
        {screen === 6 && (
          <Feedback3 s3What={s3What} showNextSteps={showNextSteps} setShowNextSteps={setShowNextSteps} />
        )}
        {screen === 7 && <CongratsScreen />}

      </div>

      {!isCongratsScreen && (
        <NavBar
          onPrev={goPrev}
          onNext={goNext}
          canPrev={screen > 1}
          canNext={canProceed()}
          nextLabel={screen === TOTAL_SCREENS ? 'COMPLETE ACTIVITY' : 'NEXT'}
          nextTooltip={nextTooltip()}
        />
      )}

      {isCongratsScreen && (
        <div style={{
          position: 'fixed', bottom: 0, left: 0, right: 0,
          display: 'flex', justifyContent: 'flex-start', alignItems: 'center',
          padding: '12px 32px', background: C.white,
          borderTop: `1px solid ${C.border}`,
          boxShadow: '0 -2px 10px rgba(0,0,0,0.08)', zIndex: 1000,
        }}>
          <StyledButton variant="secondary" onClick={goPrev}>PREVIOUS</StyledButton>
        </div>
      )}
    </div>
  );
}

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(Activity));
  </script>
</body>
</html>
